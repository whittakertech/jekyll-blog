<div class="flex flex-col gap-6 md:flex-row">
  <div class="flex-none">
    <div class="w-12 h-12 bg-neutral-700 text-white text-center rounded-lg flex items-center justify-center mb-6">
      {% include icon.html name=include.icon size=8 %}
    </div>
  </div>
  <div>
    <p class="text-sm uppercase tracking-widest text-primary">
      {{ include.title }}
    </p>
    <p class="text-xl w-[80%]">
      {{ include.heading }}
    </p>
    <p class="text-sm">
      {{ include.copy }}
    </p>
  </div>
</div>
