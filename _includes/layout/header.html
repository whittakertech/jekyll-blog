<header class="main-header sticky top-0 z-50" x-data="{ open: false }">
  <div class="container-custom flex items-center justify-between gap-6 py-4">
    {% include logo.html %}

    <div class="flex items-center gap-6">
      <div class="hidden md:block">
        {% include links/navigation.html %}
      </div>

      <a href="{{ '/contact/' | relative_url }}"
         class="hidden md:inline-flex items-center rounded-md border border-text/30 px-4 py-2 text-sm font-medium text-text transition-colors hover:border-primary hover:text-primary">
        Get in touch <span class="text-primary ml-2">{% include icon.html name="arrow-northeast" %}</span>
      </a>
    </div>

    <button type="button"
            class="md:hidden rounded-md p-2 text-text hover:text-primary"
            aria-label="Toggle navigation"
            aria-controls="mobile-navigation"
            :aria-expanded="open.toString()"
            @click="open = !open">
      {% include icon.html name='hamburger-menu' size=6 %}
    </button>
  </div>

  <nav id="mobile-navigation"
       aria-label="Mobile navigation"
       class="container-custom border-t border-text/20 pb-4 md:hidden"
       x-cloak
       x-show="open"
       x-transition>
    <div class="flex flex-col gap-2 pt-4">
      {% for item in site.data.navigation.main %}
      <a href="{{ item.url | relative_url }}"
         class="rounded-md px-3 py-2 text-text hover:text-primary"
         {% if page.url == item.url %}aria-current="page"{% endif %}
         @click="open = false">
        {{ item.name }}
      </a>
      {% endfor %}

      <a href="{{ '/contact/' | relative_url }}"
         class="rounded-md px-3 py-2 font-medium text-primary"
         @click="open = false">
        Get in touch ↗
      </a>
    </div>
  </nav>
</header>
