{% comment %}
  Related products as small product tiles.
  Params: products (product documents; the caller picks and limits them)
{% endcomment %}
<section class="product-section" aria-labelledby="related-products-heading">
  <h2 id="related-products-heading" class="product-section-label">Related products</h2>
  <div class="grid gap-4 sm:grid-cols-2">
    {% for related_product in include.products %}
      {% include product-tile.html product=related_product shape="small" %}
    {% endfor %}
  </div>
</section>
