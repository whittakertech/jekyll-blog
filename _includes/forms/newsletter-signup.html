<form action="https://formspree.io/f/xpwrqyyv"
      method="post"
      class="flex"
      data-track="email-signup"
      data-location="{{ includes.location | default: 'footer' }}">
  <label class="flex-1">
    <span class="sr-only">Email address</span>
    <input type="email"
           name="email"
           autocomplete="email"
           placeholder="your@email.com"
           class="w-full px-3 py-1 border border-gray-300 bg-dark text-gray-300 rounded-none rounded-l-md
                  focus:ring-0 focus:border-primary"
           required />
  </label>
  <button type="submit"
          class="bg-primary hover:bg-primary/90 whitespace-nowrap text-gray-900 font-medium px-2 py-1
                 rounded-none rounded-r-md transition-colors">
    Sign Up
  </button>
</form>
