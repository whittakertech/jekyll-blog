name: Build Draft Preview

on:
  push:
    branches: [drafts]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build CSS
        run: npm ci && npm run build:css-prod

      - name: Build with drafts and future posts
        run: bundle exec jekyll build --drafts --future --config _config.yml,_config_preview.yml
        env:
          JEKYLL_ENV: development

      - name: Upload preview for download
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: _site/
          retention-days: 7
