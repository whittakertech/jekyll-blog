# Content validation and quality checks
name: Content Validation

on:
  push:
    branches: [master, drafts]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Build CSS with Tailwind 4
        run: npm ci && npm run build:css-prod

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Test site image resolver (offline)
        run: ruby test/site_images_test.rb

      - name: Check scheduled publishing behavior
        run: |
          tmp=$(mktemp -d)
          mkdir -p "$tmp/_drafts"
          cat > "$tmp/_drafts/due.md" <<'POST'
          ---
          date: "2001-01-01 09:00:00 -0600"
          published: false
          title: Due
          ---
          Content
          POST
          cat > "$tmp/_drafts/future.md" <<'POST'
          ---
          date: "2099-01-01 09:00:00 -0600"
          published: false
          title: Future
          ---
          Content
          POST
          (cd "$tmp" && ruby "$GITHUB_WORKSPACE/scripts/publish_due_drafts.rb")
          test -f "$tmp/_posts/2001-01-01-due.md"
          test ! -f "$tmp/_drafts/due.md"
          test -f "$tmp/_drafts/future.md"
          grep -q '^published: true$' "$tmp/_posts/2001-01-01-due.md"

      - name: Validate front matter
        run: |
          echo "🔍 Validating front matter in posts..."
          
          # Check all posts have required fields
          for file in _posts/*.md; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
          
              # Check for required fields
              if ! grep -q "^title:" "$file"; then
                echo "❌ Missing title in $file"
                exit 1
              fi
          
              if ! grep -q "^description:" "$file"; then
                echo "❌ Missing description in $file"
                exit 1
              fi
          
              if ! grep -q "^date:" "$file"; then
                echo "❌ Missing date in $file"
                exit 1
              fi
          
              if ! grep -q "^slug:" "$file"; then
                echo "❌ Missing slug in $file"
                exit 1
              fi
          
              if ! grep -q "^canonical_url:" "$file"; then
                echo "❌ Missing canonical_url in $file"
                exit 1
              fi
          
              # Check description length (should be 150-160 chars for SEO)
              desc_line=$(grep "^description:" "$file" | head -1)
              desc_content=$(echo "$desc_line" | sed 's/description: *"//' | sed 's/"$//')
              desc_length=${#desc_content}
          
              if [ $desc_length -lt 120 ] || [ $desc_length -gt 160 ]; then
                echo "⚠️  Description in $file is $desc_length chars (recommended: 120-160)"
              fi
          
              echo "✅ $file passed validation"
            fi
          done
          
          echo "✅ All front matter validation passed!"

      - name: Validate Jekyll build
        run: |
          echo "🏗️ Testing Jekyll build..."
          bundle exec jekyll build --strict_front_matter
          echo "✅ Jekyll build successful!"

      - name: Verify rendered product links
        run: |
          ruby <<'RUBY'
          %w[midas poly].each do |slug|
            html = File.read("_site/products/#{slug}/index.html")
            links = html.scan(/<a\b[^>]*>.*?<\/a>/m)
            product_links = links.select do |link|
              tag = link[/\A<a\b[^>]*>/]
              tag.match?(/\bhref="https?:\/\//) &&
                tag.match?(/\bclass="(?:product-tile-cta|product-fact-link|inline-flex items-center)/)
            end
            abort "No external product links found for #{slug}" if product_links.empty?

            product_links.each do |link|
              tag = link[/\A<a\b[^>]*>/]
              abort "Missing external link attributes for #{slug}: #{tag}" unless tag.include?('target="_blank" rel="noopener noreferrer"')
              abort "External link attributes in body for #{slug}: #{tag}" if link.delete_prefix(tag).include?('target="_blank"')
            end

            if slug == "midas"
              docs_links = product_links.count { |link| link.start_with?('<a href="https://midas.whittakertech.com" class="product-tile-cta') }
              abort "Expected masthead and installation documentation links" unless docs_links == 2
            end
          end
          RUBY

      - name: Verify blog images and metadata
        run: ruby scripts/check_blog_output.rb

      - name: Check for broken internal links
        run: |
          echo "🔗 Checking internal links..."
          
          # Build site first
          bundle exec jekyll build
          
          # Simple check for common broken link patterns
          if grep -r "](/[^)]*" _site/ | grep -E "\]\([^)]*\s+[^)]*\)"; then
            echo "❌ Found potential broken internal links with spaces"
            exit 1
          fi
          
          echo "✅ Internal link check passed!"

      - name: Validate markdown syntax
        uses: articulate/actions-markdownlint@v1
        with:
          config: .markdownlint.json
          files: '_posts/*.md _pages/*.md *.md'
          ignore: 'vendor'
        continue-on-error: true

      - name: SEO validation
        run: |
          echo "🎯 Running SEO validation..."
          
          # Check that all posts have unique slugs
          slugs=$(grep -r "^slug:" _posts/ | cut -d'"' -f2 | sort)
          unique_slugs=$(echo "$slugs" | sort -u)
          
          if [ "$(echo "$slugs" | wc -l)" != "$(echo "$unique_slugs" | wc -l)" ]; then
            echo "❌ Duplicate slugs found!"
            echo "All slugs:"
            echo "$slugs"
            exit 1
          fi
          
          # Check canonical URLs match expected pattern
          for file in _posts/*.md; do
            if [ -f "$file" ]; then
              slug=$(grep "^slug:" "$file" | cut -d'"' -f2)
              canonical=$(grep "^canonical_url:" "$file" | cut -d'"' -f2)
              expected="https://whittakertech.com/blog/$slug/"
          
              if [ "$canonical" != "$expected" ]; then
                echo "❌ Canonical URL mismatch in $file"
                echo "   Expected: $expected"
                echo "   Found: $canonical"
                exit 1
              fi
            fi
          done
          
          echo "✅ SEO validation passed!"
