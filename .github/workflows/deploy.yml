name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # Rebuild after scheduled drafts become due; this workflow deploys them itself.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Publish due drafts
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          count=$(ruby scripts/publish_due_drafts.rb)
          if [ "$count" -gt 0 ]; then
            git config user.email "action@github.com"
            git config user.name "GitHub Action"
            git add -A -- _posts _drafts
            git commit -m "Publish $count scheduled post(s)"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build:css-prod
        env:
          NODE_ENV: production

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
