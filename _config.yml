name: "WhittakerTech"
tagline: "Ruby and Rails tools"
title: "WhittakerTech"
description: >-
  Ruby and Rails tools, engineering writing, and the work behind WhittakerTech.
baseurl: ""
url: "https://whittakertech.com"

author:
  name: "Lee Whittaker"
  email: "lee@whittakertech.com"
  twitter: "whittakertech"
  linkedin: "lee-whittaker-dev"

repository: whittakertech/www
github:
  repository_name: www
  owner_name: whittakertech

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

# Critical: This matches your sitemap exactly
permalink: /blog/:title/

trackers:
  clarity_id: "rww60qbk1z"
  ga_id: "G-MSFXKRLPJL"

# Feed configuration for better SEO
feed:
  posts_limit: 20
  excerpt_only: true

# SEO optimization
timezone: America/Denver  # Your timezone for proper dates

# Social media defaults (customize as needed)
twitter:
  username: whittakertech
  card: summary_large_image

# Collections
collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /blog/:title/  # Redundant but explicit
  products:
    output: true
    permalink: /products/:slug/
    sort_by: title

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Lee Whittaker"
      robots: "index, follow"
      sitemap: true
      excerpt_separator: "<!--more-->"
      schema_type: "BlogPosting"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      seo:
        type: "WebPage"
      robots: "index, follow"
      sitemap: true
  - scope:
      path: "blog"
    values:
      layout: "blog"
      robots: "index, follow"
      sitemap: true
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
      seo:
        type: "SoftwareApplication"
      schema_type: "SoftwareApplication"
      robots: "index, follow"
      sitemap: true
  # Default social preview image (og:image / twitter:image) for non-post pages.
  # jekyll-seo-tag reads only the per-page `image` (not a site-level one), so the
  # default is applied via these scopes; a page's own `image` front matter wins.
  # Placeholder until real OG art exists.
  - scope:
      path: ""
      type: "pages"
    values:
      image: /assets/images/og/whittakertech-site-v1.jpg
  - scope:
      path: "blog"
    values:
      image: /assets/images/og/whittakertech-site-v1.jpg
  - scope:
      path: ""
      type: "products"
    values:
      image: /assets/images/og/whittakertech-site-v1.jpg

# Pagination for blog index
paginate: 10
paginate_path: "/blog/page/:num/"

# Exclude from processing
exclude:
  - .idea/
  - Dockerfile
  - docker-compose.yml
  - vendor/
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github/
  - scripts/
  - Makefile
  - "*.sh"
  - node_modules/
  - package.json
  - package-lock.json
  # Tailwind sources; only the compiled assets/css/site.css is published
  - assets/css/main.css
  - assets/css/tokens/
  - assets/css/elements/
