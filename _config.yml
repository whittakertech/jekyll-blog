name: "WhittakerTech"
tagline: "Software Development & Technical Services"
title: "WhittakerTech - Software Development & Technical Services"
description: >-
  A technology blog covering web development, DevOps, and software engineering.
baseurl: ""
url: "https://whittakertech.com"

author:
  name: "Lee Whittaker"
  email: "lee@whittakertech.com"
  twitter: "whittakertech"
  linkedin: "lee-whittaker-dev"

repository: whittakertech/jekyll-blog
github:
  repository_name: jekyll-blog
  owner_name: whittakertech

plugins:
  - jekyll-feed
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

# Critical: This matches your sitemap exactly
permalink: /blog/:title/

trackers:
  clarity_id: "rww60qbk1z"
  ga_id: "G-MSFXKRLPJL"
  hotjar_id: "6429836"

# Feed configuration for better SEO
feed:
  posts_limit: 20
  excerpt_only: true

# SEO optimization
timezone: America/Denver  # Your timezone for proper dates

# Social media defaults (customize as needed)
twitter:
  username: whittakertech
  card: summary_large_image

# Collections
collections:
  pages:
    output: true
    permalink: /:name/
  posts:
    output: true
    permalink: /blog/:title/  # Redundant but explicit
  portfolio:
    output: true
    permalink: /portfolio/:title/
  products:
    output: true
    permalink: /products/:slug/
    sort_by: title

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Lee Whittaker"
      robots: "index, follow"
      sitemap: true
      excerpt_separator: "<!--more-->"
      schema_type: "BlogPosting"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"
      robots: "index, follow"
      sitemap: true
  - scope:
      path: "blog"
    values:
      layout: "blog"
      robots: "index, follow"
      sitemap: true
  - scope:
      path: ""
      type: "portfolio"
    values:
      layout: "case_study"
      robots: "index, follow"
      sitemap: true
  - scope:
      path: ""
      type: "products"
    values:
      layout: "product"
      robots: "index, follow"
      sitemap: true

# Pagination for blog index
paginate: 10
paginate_path: "/blog/page/:num/"

# Exclude from processing
exclude:
  - .idea/
  - Dockerfile
  - docker-compose.yml
  - vendor/
  - README.md
  - Gemfile
  - Gemfile.lock
  - .github/
  - scripts/
  - Makefile
  - "*.sh"
  - node_modules/
  - package.json
  - package-lock.json
  # Tailwind sources; only the compiled assets/css/site.css is published
  - assets/css/main.css
  - assets/css/tokens/
  - assets/css/elements/
