# Blog image manifest — the contract between the Aerie media workbench (producer)
# and this site (consumer). Posts reference an entry with `image_key:`; posts with
# no key (and no legacy `hero_image:`) use `fallback`. Resolved by _plugins/blog_images.rb.
#
# Entry shape:
#   original:  { url, width, height }         untouched source on media.whittakertech.com
#   variants:
#     card:    { jpeg: [{url, width, height}], webp: [...], png: [...] }   16:10 crops, ascending width
#     hero:    { jpeg: [...], webp: [...], png: [...] }                    2:1 crops, ascending width
#   og:        { url, width: 1200, height: 630 }   JPEG or PNG; series badge baked in by Aerie
#   alt:       description when the image conveys meaning; "" when decorative
#   focal:     CSS object-position for crops, e.g. "35% 45%"
#   credit:    { photographer, source_url, license, license_url }
#
# URL rules: originals live under .../originals/, processed output under .../processed/.
# Replacing an image means a new versioned filename (…-v2.jpg), never overwriting a published URL.
# `png` variants stay available for download but are never the default for photographic cards.
# An entry without `variants` is pending: pages show the fallback artwork and fallback.og until
# Aerie publishes processed output. Originals are never served. Without `og`, fallback.og is used.
# The build validates this file: usable https:// or root-relative URLs, positive integer
# dimensions, JPEG/PNG OG images, a jpeg list per variant, and one aspect ratio per variant set.

fallback:
  alt: "WhittakerTech — Ideas from the work."
  focal: "50% 50%"
  og:
    url: "/assets/images/og/whittakertech-fallback-v1.jpg"
    width: 1200
    height: 630
  credit:
    photographer: WhittakerTech
    license: "Owned; source in _media/og-fallback-v1.svg"

